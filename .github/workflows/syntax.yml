name: Amber syntax check

on:
  push:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python sources
        run: python -m compileall -q amber training tokenizer inference evaluation tests amber_app.py

      - name: Test clean-data pipeline
        run: python -m unittest tests.test_v02_data
